<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>Hello Hi abonnement</title>
</head>

<body>

    <h1>Hello Hi abonnement</h1>

    <form>

        Voornaam:<br>
        <input type="text" name="voornaam"
            pattern="[A-Za-zÀ-ÿ\s]+"
            required>
        <br><br>

        Achternaam:<br>
        <input type="text" name="achternaam"
            pattern="[A-Za-zÀ-ÿ\s]+"
            required>
        <br><br>

        Aanhef:<br>
        <input type="radio" name="aanhef" value="Dhr." checked> Dhr.
        <input type="radio" name="aanhef" value="Mevr."> Mevr.
        <input type="radio" name="aanhef" value="Anders"> Anders
        <br><br>

        Straat met huisnummer:<br>
        <input type="text" name="adres"
            placeholder="Stationsweg 12"
            required>
        <br><br>

        Postcode:<br>
        <input type="text" name="postcode"
            placeholder="1234 AB"
            pattern="[0-9]{4} [A-Za-z]{2}"
            maxlength="7"
            required>
        <br><br>

        Woonplaats:<br>
        <input type="text" name="woonplaats" required>
        <br><br>

        Land:<br>
        <select name="land" required>
            <option value="">Kies een land</option>
            <option value="Nederland">Nederland</option>
            <option value="België">België</option>
            <option value="Duitsland">Duitsland</option>
        </select>
        <br><br>

        IBAN-nummer:<br>
        <input type="text" name="iban"
            placeholder="NL91ABNA0417164300"
            pattern="NL[0-9]{2}[A-Z]{4}[0-9]{10}"
            maxlength="18"
            required>
        <br><br>

        Type abonnement:<br>
        <select name="abonnement" required>
            <option value="">Kies een abonnement</option>
            <option value="Mobiel">Mobiel</option>
            <option value="Glasvezel">Glasvezel</option>
            <option value="TV">TV</option>
        </select>
        <br><br>

        Datum van ingang abonnement:<br>
        <input type="date" name="datum"
            min="2026-09-30"
            required>
        <br><br>

        Looptijd abonnement in maanden:<br>
        <input type="number" name="looptijd"
            min="1"
            required>
        <br><br>

        Aantal gebruikers:<br>
        <input type="number" name="gebruikers"
            min="0"
            max="4"
            required>
        <br><br>

        E-mailadres:<br>
        <input type="email" name="email" required>  
        <br><br>

        Wachtwoord aanmaken:<br>
        <input type="password" name="wachtwoord" required>
        <br><br>

        <input type="submit" value="Sluit abonnement af">

    </form>

</body>

</html>
