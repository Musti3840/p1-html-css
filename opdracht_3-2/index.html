<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hallo Hi, Abonnementsformulier</title>
</head>
<body>
    <h1>Hallo Hi! Abonnementsformulier</h1>
    <!--Voornaam-->
    <form action="#" method="post">
      <label for="voornaam">voornaam</label>
      <input type="text" id="voornaam" name="voornaam"
          pattern="[A-Za-zÀ-ÿ\s-]+"
          title="Gebruik alleen letters" required>
            <!--achternaam-->
            <br>
            <br>
            
    
            <label for="achternaam">achternaam</label>
      <input type="text" id="achternaam" name="achternaam"
          pattern="[A-Za-zÀ-ÿ\s-]+"
          title="Gebruik alleen letters" 
          required
          />
          <br>
          <br>
          <!-- Aanhef -->
           <label>Aanhef</label>
           <input type="radio" id="dhr" name="aanhef" value="dhr" checked>
           <label for="dhr">Dhr.</label>
           <input type="radio" id="mevr" name="aanhef" value="mevr"/>
           <label for="mevr">mevr.</label>
            <input type="radio" id="anders" name="aanhef" value="anders"/>
           <label for="anders">anders.</label><br>
           <br>
           <br>


           <!-- Straat -->
           <label for="straat">Straat met huisnummer</label>
           <input type="text" id="straat" name="straat" placeholder="Stationsweg 12" required>
           
           
           

        <br>
        <br>
        <label for="Postcode">Postcode</label>
        <input type="text" id="postcode" name="postcode"
        pattern="[1-9][0-9]{3}\s?[A-Z]{2}"
        placeholder="1234 AB"
        required>
        
        
        <br>
        <br>
        <label for="Woonplaats">Woonplaats</label>
        <input type="text" id="woonplaats" name="woonplaats" 

        placeholder="Uw Stad">
        
        <br>
        <br>  
        <label for="Land">Land</label>
        <input type="text" id="land" name="land"
        placeholder="Uw Land">  
         
        <br>
         <br>
        <!-- IBAN -->
        <label for="iban" IBAN-nummer>IBAN</label>
        <input type="text" id="iban" name="iban"
        maxlength="18"
        pattern="NL [0-9]{2}[A-Z]{4}[0-9][10]"
        placeholder="NL91ABNA0417164300"
        required>
        
        <br>
        <br>
        <!--Abonnement-->
        <label for="abonnement"> Type Abonnement</label>
        <select id="abonnement" name="abonnement" required>
            <option value="kies een abonnement"></option>
            <option>Mobiel</option>
            <option>Glasvezel</option>
            <option>TV</option>




        </select>

 






    </form>
  </body>
</html>
